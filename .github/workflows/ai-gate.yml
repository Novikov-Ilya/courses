name: AI-Augmented Quality Gate

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  ai-test-selection:
    runs-on: self-hosted # Задача идет строго на твой ПК

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Качаем всю историю для git diff

      - name: Install Dependencies
        run: npm ci

      - name: Start Backend & Frontend Applications
        shell: bash
        run: |
          echo "🚀 Installing Backend Dependencies & Starting NestJS Backend..."
          # Переходим в точную папку бэкенда
          cd ../courses-app-backend
          npm ci || npm install
          npm run start &
          
          echo "🚀 Starting Frontend App..."
          # Возвращаемся в корневую папку фронтенда раннера
          cd $GITHUB_WORKSPACE
          npm run dev &
          
          echo "⏳ Waiting for NestJS (4000) and Vite (5173) to become active..."
          for i in {1..30}; do
            if curl -s http://localhost:5173 > /dev/null && curl -s http://localhost:4000/api > /dev/null; then
              echo "✅ Complete Infrastructure (Frontend + NestJS Backend) is up and running!"
              break
            fi
            sleep 2
          done


      - name: Run AI Impact Analysis & Smart Regression via Script
        shell: bash
        run: |
          # Даем права на исполнение скрипту (актуально для Bash-окружения)
          chmod +x ./ai-regression-filter.sh
          
          # Запускаем наш единый скрипт автоматизации
          ./ai-regression-filter.sh

      - name: Upload Playwright HTML Report to GitHub
        if: always() # Выгружаем отчет в любом случае (даже при падении тестов)
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-artifact
          path: |
            qa-ai-framework/playwright-report/
            playwright-report/
          retention-days: 7
