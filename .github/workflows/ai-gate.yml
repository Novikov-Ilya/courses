name: AI-Augmented Quality Gate

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  ai-test-selection:
    runs-on: self-hosted # Задача идет строго на твой ПК

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: npm ci

      - name: Run AI Impact Analysis & Smart Regression via Script
        shell: bash
        run: |
          # Даем права и делегируем абсолютно всю работу нашему умному скрипту
          chmod +x ./ai-regression-filter.sh
          ./ai-regression-filter.sh

      - name: Upload Playwright HTML Report to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-artifact
          path: |
            qa-ai-framework/playwright-report/
            playwright-report/
          retention-days: 7
